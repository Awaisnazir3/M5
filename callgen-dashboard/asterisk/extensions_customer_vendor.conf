; ==============================================================================
; Asterisk 23 Customer-Vendor Dialplan & Prefix Routing
; Dynamically generated by callgen-sync-inbound
; ==============================================================================

[from-cust-zong]
; Routing logic for Customer: Adil-Telecom-88 (Max Channels: 80)
; 1. Real-time Status Check in AstDB
exten => _X.,1,NoOp(==============================================================)
same => n,NoOp(>>> INCOMING CALL FROM CUSTOMER: Adil-Telecom-88 (ID: zong) <<<)
same => n,NoOp(CallerID: ${CALLERID(all)} | Dialed: ${EXTEN} | IP: ${CHANNEL(recvip)})
same => n,NoOp(==============================================================)
same => n,Set(CUST_STATUS=${DB(customer/cust_zong/status)})
same => n,GotoIf($["${CUST_STATUS}" = "blocked"]?cust_blocked)
; 2. Customer Channel Concurrency Check
same => n,Set(GROUP(customer)=cust_zong)
same => n,GotoIf($[${GROUP_COUNT(cust_zong@customer)} > 80]?cust_ch_limit)
same => n,Set(ORIGINAL_EXTEN=${EXTEN})
same => n,Set(CDR(accountcode)=Adil-Telecom-88)
; Route matching customer prefix: 76666
exten => _76666.,1,NoOp(>>> Route prefix 76666 for Adil-Telecom-88 <<<)
same => n,Set(CUST_STATUS=${DB(customer/cust_zong/status)})
same => n,GotoIf($["${CUST_STATUS}" = "blocked"]?cust_blocked)
same => n,Set(GROUP(customer)=cust_zong)
same => n,GotoIf($[${GROUP_COUNT(cust_zong@customer)} > 80]?cust_ch_limit)
same => n,Set(ORIGINAL_EXTEN=${EXTEN})
same => n,Set(CLEAN_DEST=${EXTEN:5})
same => n,Set(CDR(accountcode)=Adil-Telecom-88)
; --- Vendor Attempt #1: Adil-Vendor-133 (Priority 1) ---
same => n,Set(VEND_STATUS=${DB(vendor/vend_boc/status)})
same => n,GotoIf($["${VEND_STATUS}" = "blocked"]?skip_vend_0)
same => n,Set(GROUP(vendor)=vend_boc)
same => n,GotoIf($[${GROUP_COUNT(vend_boc@vendor)} > 200]?skip_vend_0)
same => n,Set(DIAL_NUM=88555${CLEAN_DEST})
same => n,Set(CDR(userfield)=cust:zong:vend:boc:${ORIGINAL_EXTEN}:${CLEAN_DEST}:${DIAL_NUM})
same => n,Dial(PJSIP/${DIAL_NUM}@vend-boc,60,g)
same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?call_done)
same => n(skip_vend_0),NoOp(>>> Failover from Vendor Adil-Vendor-133 (Status: ${DIALSTATUS}) <<<)
same => n,Playtones(congestion)
same => n,Hangup(34)
; Customer Blocked label
same => n(cust_blocked),NoOp(>>> CALL REJECTED: CUSTOMER IS BLOCKED IN PORTAL <<<)
same => n,Set(CDR(userfield)=cust_blocked:zong:${ORIGINAL_EXTEN})
same => n,Hangup(21)
; Customer Channel Limit label
same => n(cust_ch_limit),NoOp(>>> CALL REJECTED: CUSTOMER EXCEEDED CHANNEL LIMIT <<<)
same => n,Set(CDR(userfield)=cust_channel_limit:zong:${ORIGINAL_EXTEN})
same => n,Hangup(17)
; Call completed successfully
same => n(call_done),Hangup()

; Reject unallowed destination numbers
exten => _X.,2,NoOp(>>> NUMBER NOT ALLOWED FOR CUSTOMER Adil-Telecom-88 <<<)
same => n,Set(CDR(userfield)=cust_unauthorized_dest:zong:${EXTEN})
same => n,Hangup(21)
exten => s,1,Hangup(21)
exten => i,1,Hangup(21)
exten => h,1,Hangup()
