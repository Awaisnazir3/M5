[general]

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Mali Route Trunk (Target: 192.168.88.76:5080, CC: 2237)
[mali-trunk]
type=endpoint
context=testcall2
disallow=all
allow=ulaw,alaw,g729,gsm,g722
aors=mali-trunk
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[mali-trunk]
type=aor
contact=sip:192.168.88.76:5080

[mali-trunk]
type=identify
endpoint=mali-trunk
match=192.168.88.76

