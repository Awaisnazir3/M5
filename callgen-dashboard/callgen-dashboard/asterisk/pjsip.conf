; ==============================================================================
; Anonymous Endpoint: Strict Rejection for Unlisted / Unauthorized Source IPs
; ==============================================================================
[anonymous]
type=endpoint
context=unauthorized-ip-blocked
disallow=all
allow=ulaw,alaw,g729

; ==============================================================================
; Dynamic Inbound Trunk (Managed automatically by callgen-sync-inbound.py)
; ==============================================================================
#include pjsip_inbound.conf
