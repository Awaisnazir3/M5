[general]

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ==============================================================================
; M5-Traffic Controller: Default Trunk Endpoints
; (IPs and prefixes can be customized anytime from Web Portal or /etc/callgen-*.json)
; ==============================================================================

; Mali Route Trunk (Target: 202.125.153.97, CC: 2237)
[mali-trunk]
type=endpoint
transport=transport-udp
context=testcall2
disallow=all
allow=ulaw,alaw,g729
aors=mali-trunk
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[mali-trunk]
type=aor
contact=sip:202.125.153.97:5060

[mali-trunk]
type=identify
endpoint=mali-trunk
match=202.125.153.97

; Cuba Route Trunk (Target: 206.251.255.21, CC: 53, Prefix: 4444)
[cuba-trunk]
type=endpoint
transport=transport-udp
context=testcall
disallow=all
allow=ulaw,alaw,g729
aors=cuba-trunk
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[cuba-trunk]
type=aor
contact=sip:206.251.255.21:5060

[cuba-trunk]
type=identify
endpoint=cuba-trunk
match=206.251.255.21

; Senegal Route Trunk (Target: 178.22.15.201, CC: 221, Prefix: 619334)
[senegal-trunk]
type=endpoint
transport=transport-udp
context=testcall
disallow=all
allow=ulaw,alaw,g729
aors=senegal-trunk
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[senegal-trunk]
