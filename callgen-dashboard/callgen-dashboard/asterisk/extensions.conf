[general]
static=yes
writeprotect=no
clearglobalvars=no

[default]
exten => _!,1,NoOp(==============================================================)
same => n,NoOp(>>> SECURITY ALERT: INCOMING CALL REJECTED ON DEFAULT FROM ${CHANNEL(recvip)} <<<)
same => n,NoOp(CallerID: ${CALLERID(all)} | Dialed: ${EXTEN} | Cause: 21 Rejected)
same => n,NoOp(==============================================================)
same => n,Set(CDR(userfield)=unlisted_ip_rejected:${CHANNEL(recvip)}:${EXTEN})
same => n,Hangup(21)

exten => s,1,NoOp(==============================================================)
same => n,NoOp(>>> SECURITY ALERT: INCOMING CALL REJECTED ON DEFAULT 's' FROM ${CHANNEL(recvip)} <<<)
same => n,NoOp(==============================================================)
same => n,Set(CDR(userfield)=unlisted_ip_rejected:${CHANNEL(recvip)}:s)
same => n,Hangup(21)

exten => i,1,Hangup(21)
exten => e,1,Hangup(21)
exten => t,1,Hangup()
exten => T,1,Hangup()
exten => h,1,Hangup()

; Contexts [testcall], [testcall2], and [from-inbound] are managed dynamically
; from the Portal in extensions_inbound.conf
[from-13]
include => from-inbound

#include extensions_inbound.conf
